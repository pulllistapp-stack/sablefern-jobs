name: Daily TCGplayer / TCGCSV price sync

# Pulls the day's TCGCSV archive and refreshes card market prices,
# then tops up Cardmarket figures.
#
# Moved here from the main repo so it runs on public-repo Actions
# minutes. Nothing in this job touches a browser or an anti-bot
# surface — it reads a published price archive over plain HTTP.

on:
  schedule:
    # 08:00 UTC. Kept identical to the schedule this ran on in the
    # main repo so downstream jobs (products sync at 08:15, portfolio
    # snapshot at 09:00) still see fresh prices.
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: TCGCSV daily tier
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scripts.sync_tcgcsv_daily --tier daily

      - name: Cardmarket top-up
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Optional but wanted: raises the pokemontcg.io ceiling from
          # 1k/hour anonymous to 20k/day. Without it this step still
          # runs, just against a limit it can hit mid-sweep.
          POKEMONTCG_API_KEY: ${{ secrets.POKEMONTCG_API_KEY }}
        run: python -m scripts.sync_tcgplayer_prices --cardmarket-only
