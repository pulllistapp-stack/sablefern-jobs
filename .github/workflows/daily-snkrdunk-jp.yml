name: Daily Snkrdunk JP price sync

# Pulls JP-domestic asking prices from Snkrdunk (スニダン) into
# card_price_snapshots as source="snkrdunk", variant="active".
#
# Why this job exists: TCGplayer's JP coverage stops exactly where the
# catalog is most valuable — vintage sets it never carried, and the
# promo cards collectors chase. eBay can't fill it either, because JP
# card names are Japanese and eBay Browse is keyword-driven. Snkrdunk
# is the JP-domestic market and prices those cards.
#
# Rotation: a full sweep is thousands of API calls against someone
# else's public API, so JP sets are split into 7 deterministic shards
# and one runs per day. Every set is refreshed weekly; no single day
# hammers the endpoint. The client also rate-limits internally.
#
# Scheduled at 10:30 UTC — after the nightly TCGCSV sync (08:00) and
# the price integrity audit (09:30), so this never overlaps a bulk
# writer. A concurrent backfill once deadlocked a deploy's boot DDL;
# same lesson applies to stacking writers.
#
# This job only INSERTs snapshots. It never touches
# cards.market_price_usd — that column stays TCGplayer-anchored, and
# promoting an asking-side source into the headline price is a
# separate, deliberate decision.

on:
  schedule:
    - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      shard:
        description: 'Shard i/n (blank = the day-of-week shard)'
        required: false
        default: ''
        type: string
      only:
        description: 'Single set id, e.g. m6 (overrides shard)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry run (1 = no writes)'
        required: false
        default: '0'
        type: choice
        options:
          - '0'
          - '1'

# Never let two of these overlap — a manual dispatch during the
# scheduled run would double the request rate against Snkrdunk.
concurrency:
  group: snkrdunk-jp
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          # Private app repo checked out via a read-only deploy key —
          # this public repo carries only the workflow files.
          repository: pulllistapp-stack/pulllist
          ssh-key: ${{ secrets.PULLLIST_DEPLOY_KEY }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        run: pip install -r requirements.txt

      - name: Sync Snkrdunk prices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          ARGS=""
          if [ -n "${{ inputs.only }}" ]; then
            ARGS="--only ${{ inputs.only }}"
          elif [ -n "${{ inputs.shard }}" ]; then
            ARGS="--shard ${{ inputs.shard }}"
          else
            # Day-of-week picks the shard: 7 shards, every set weekly.
            ARGS="--shard $(date -u +%w)/7"
          fi

          if [ "${{ inputs.dry_run }}" = "1" ]; then
            python -m scripts.sync_snkrdunk_jp --dry-run $ARGS 2>&1 | tee snkrdunk.log
          else
            python -m scripts.sync_snkrdunk_jp --apply $ARGS 2>&1 | tee snkrdunk.log
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Snkrdunk JP sync"
            echo '```'
            grep -E "target JP sets|=== TOTAL|matched=" snkrdunk.log | tail -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
