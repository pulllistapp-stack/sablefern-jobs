name: Daily Snkrdunk JP sealed sync

# Refreshes the JP-exclusive sealed products that only Snkrdunk carries
# — the XY BREAK Special Boxes with the Poncho Pikachu promos, premium
# trainer boxes, high-class packs. TCGCSV lists 1,867 sealed products
# but only 299 tied to a JP set, and the gap is exactly the expensive
# end of the catalogue.
#
# Why this exists as its own job: `daily-snkrdunk-jp` runs
# sync_snkrdunk_jp, which is a CARD price sync. It writes cards and
# card_price_snapshots and never touches `products`. That job has been
# green every day, which made it look like JP sealed was covered too.
# It was not — ingest_snkrdunk_sealed had never been scheduled at all,
# so 283 products were seeded by hand on 2026-08-28 and then sat
# frozen, still showing August prices three weeks later with nothing
# to indicate they were stale. Found 2026-09-19.
#
# The script upserts on the snkrdunk apparel id, so re-running is a
# price refresh rather than a duplicate insert. It also deliberately
# leaves set_id and tcgplayer_product_id null: these products exist
# precisely because TCGplayer does not list them, and inventing either
# would file them under the wrong set or collide with the TCGCSV
# ingest's dedup key.
#
# A full pass is eight keyword searches plus per-product detail calls,
# so unlike the card sync there is no shard rotation to spread — one
# daily pass is small enough to be polite, and the client rate-limits
# itself.
#
# Scheduled at 12:30 UTC: clear of the TCGCSV product sync (08:15),
# the integrity audit (09:30) and the Snkrdunk card sync (10:30, up to
# 90 minutes). Shares a concurrency group with the card job so the two
# never hit Snkrdunk at the same time.

on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:
    inputs:
      keyword:
        description: 'Single keyword (blank = the default eight)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry run (1 = no writes)'
        required: false
        default: '0'
        type: choice
        options:
          - '0'
          - '1'

concurrency:
  group: snkrdunk-jp
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          # Private app repo via a read-only deploy key — this public
          # repo carries only workflow files.
          repository: pulllistapp-stack/pulllist
          ssh-key: ${{ secrets.PULLLIST_DEPLOY_KEY }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        run: pip install -r requirements.txt

      - name: Sync Snkrdunk sealed products
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          ARGS=""
          if [ -n "${{ inputs.keyword }}" ]; then
            ARGS="--keyword ${{ inputs.keyword }}"
          fi

          if [ "${{ inputs.dry_run }}" = "1" ]; then
            python -m scripts.ingest_snkrdunk_sealed --dry-run $ARGS 2>&1 | tee sealed.log
          else
            python -m scripts.ingest_snkrdunk_sealed --apply $ARGS 2>&1 | tee sealed.log
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Snkrdunk JP sealed sync"
            echo '```'
            grep -E "existing snkrdunk sealed rows|=== TOTAL|keyword .* failed" sealed.log | tail -20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
