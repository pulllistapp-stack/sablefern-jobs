name: Nightly price integrity audit

# Standing sweep for wrong-card price pollution (see
# scripts/price_integrity_audit.py): graded tier inversions, asking
# plausibility bands, prefixed-number quarantine, plus a report-only
# anchor-deviation list. Auto-quarantines only the classes where the
# evidence is unambiguous; everything else lands in the job summary
# for a human eye.
#
# Runs at 09:30 UTC (5:30am ET) — after the nightly TCGCSV sync and
# eBay scrape waves have finished writing, so the audit sees the
# day's final data and never overlaps a bulk writer (a concurrent
# backfill once deadlocked a deploy's boot DDL; same lesson).

on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (1 = report only; 0 = quarantine)'
        required: false
        default: '0'
        type: choice
        options:
          - '0'
          - '1'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          # Private app repo checked out via a read-only deploy key —
          # this public repo carries only the workflow files.
          repository: pulllistapp-stack/pulllist
          ssh-key: ${{ secrets.PULLLIST_DEPLOY_KEY }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        run: pip install -r requirements.txt

      - name: Run audit
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "1" ]; then
            python -m scripts.price_integrity_audit --dry-run 2>&1 | tee audit.log
          else
            python -m scripts.price_integrity_audit 2>&1 | tee audit.log
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Price integrity audit"
            echo '```'
            grep -E "tier inversions:|deleted|nulled|implausible:|outside anchor band:|anchor-deviation \(report|INVERSION\(sold" audit.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
