name: Daily sealed-product price sync

# Snapshots the day's TCGCSV price feed for every sealed product.
# Runs 15 minutes after the card sync so it reads the same day's
# archive rather than racing it.

on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          # Private app repo checked out via a read-only deploy key —
          # this public repo carries only the workflow files. Until
          # 2026-09-19 this job ran a copy of the script kept in this
          # repo, frozen on 2026-07-27.
          repository: pulllistapp-stack/pulllist
          ssh-key: ${{ secrets.PULLLIST_DEPLOY_KEY }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scripts.sync_products_daily
