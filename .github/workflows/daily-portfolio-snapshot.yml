name: Daily portfolio valuation snapshot

# Writes one portfolio_snapshots row per user: total value, graded-only
# value, counts. Drives the Growth chart on /portfolio and the slab
# value chart on /portfolio/slabs — miss a day and both lines show a
# carried-forward gap instead of a real reading.
#
# Scheduled an hour after the card sync so it values collections
# against the day's fresh prices rather than yesterday's.

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Backfill a specific day (YYYY-MM-DD). Blank = today."
        required: false
        default: ""

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          # Private app repo checked out via a read-only deploy key —
          # this public repo carries only the workflow files. Until
          # 2026-09-19 this job ran a copy of the script kept in this
          # repo, frozen on 2026-07-27.
          repository: pulllistapp-stack/pulllist
          ssh-key: ${{ secrets.PULLLIST_DEPLOY_KEY }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SNAPSHOT_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$SNAPSHOT_DATE" ]; then
            python -m scripts.snapshot_portfolios --date "$SNAPSHOT_DATE"
          else
            python -m scripts.snapshot_portfolios
          fi
