name: Daily market-analysis refresh

# Rebuilds published market-analysis article payloads once per day so
# the numbers inside (KPI totals, table prices, 30d deltas, sparklines,
# data-anchored prose) stay live. Slug + published_at stay pinned so
# the URL doesn't rotate under readers.
#
# Runs after eBay quota reset (midnight PT = 3am ET = 7am UTC) so the
# new day's TCGplayer snapshot is already flushed to our history API
# by the time this runs — otherwise sparklines would land a day short.

on:
  schedule:
    - cron: "0 8 * * *"  # 8am UTC = 4am ET = midnight-plus-1 PT
  workflow_dispatch:
    inputs:
      set_id:
        description: 'Set to refresh (e.g. me30). Blank = refresh all.'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry run (1 = build + log only; 0 = write to DB)'
        required: false
        default: '0'
        type: choice
        options:
          - '0'
          - '1'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          # Private app repo checked out via a read-only deploy key —
          # this public repo carries only the workflow files.
          repository: pulllistapp-stack/pulllist
          ssh-key: ${{ secrets.PULLLIST_DEPLOY_KEY }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        # The refresh script imports app.database (sqlalchemy/asyncpg)
        # — newsbot/requirements.txt never carried those, which made
        # this job fail on every scheduled run since it shipped.
        run: pip install -r requirements.txt

      - name: Refresh me30 September Wave
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PULLLIST_API_BASE: ${{ secrets.PULLLIST_API_BASE || 'https://api.pulllist.org/api/v1' }}
        # Skips when the workflow_dispatch input filters to a different
        # set. Add sibling steps below for each new market-analysis
        # article we ship (or generalize once we have a proper list).
        if: ${{ inputs.set_id == '' || inputs.set_id == 'me30' }}
        run: |
          if [ "${{ inputs.dry_run }}" = "1" ]; then
            python -m scripts.refresh_market_analysis --set me30 --slug market-2026-08-15-me30-lineup --dry-run
          else
            python -m scripts.refresh_market_analysis --set me30 --slug market-2026-08-15-me30-lineup
          fi
